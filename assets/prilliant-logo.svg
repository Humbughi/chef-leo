<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Prilliant</title>
  <desc id="desc">Prilliant-Schriftzug mit allen zugehörigen Linien und Funkeln, nahtlos in die Landingpage eingefügt.</desc>
  <defs>
    <filter id="gold" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="linear" slope="1" intercept="0"/>
        <feFuncG type="linear" slope="0.82" intercept="0"/>
        <feFuncB type="linear" slope="0.25" intercept="0"/>
        <feFuncA type="identity"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <image href="prilliant-logo-original.svg" xlink:href="prilliant-logo-original.svg" x="0" y="0" width="1536" height="1024" filter="url(#gold)"/>
</svg>
