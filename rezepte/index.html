<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prilliante Rezepte</title><style>body{margin:0;background:#090806;color:#f5eedc;font:16px system-ui}header,main{max-width:1100px;margin:auto;padding:25px}h1{color:#d7a526}a{color:#eac766}input,select{background:#1e1a10;color:white;border:1px solid #9a792d;border-radius:8px;padding:12px;margin:5px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{border:1px solid #655124;border-radius:12px;overflow:hidden;cursor:pointer;background:#17130b}.card img,.placeholder{width:100%;height:160px;object-fit:cover}.placeholder{display:grid;place-items:center;font-size:60px;background:#292315}.card h3,.card p{padding:0 15px}dialog{max-width:750px;width:90%;max-height:85vh;overflow:auto;background:#15120c;color:#f5eedc;border:1px solid #b28a30;border-radius:12px}dialog img{max-width:100%;max-height:300px;object-fit:contain}button{padding:10px;cursor:pointer}li{margin:5px 0}#count{color:#c3b694}</style></head><body><header><a href="/">← Prilliant</a><h1>Prilliante Rezepte</h1><p>Unsere Eigenkreationen und persönlichen Rezepte.</p><input id="q" placeholder="Rezepte durchsuchen …" aria-label="Rezepte durchsuchen"><select id="filter"><option value="">Alle Sammlungen</option><option>Eigenkreation</option><option>Meine Rezepte</option></select><p id="count"></p></header><main><div id="grid"></div></main><dialog id="detail"><button id="close">Schließen ✕</button><div id="body"></div></dialog><script>let recipes=[];const grid=document.querySelector('#grid');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let q=document.querySelector('#q').value.toLocaleLowerCase('de'),f=document.querySelector('#filter').value;let a=recipes.filter(r=>(!f||r.collections.includes(f))&&[r.title,...r.ingredients,...r.categories].join(' ').toLocaleLowerCase('de').includes(q));document.querySelector('#count').textContent=a.length+' Rezepte';grid.innerHTML=a.map(r=>`<article class="card" data-id="${recipes.indexOf(r)}">${r.image?`<img loading="lazy" src="${esc(r.image)}" alt="">`:'<div class="placeholder">🍽️</div>'}<h3>${esc(r.title)}</h3><p>${esc(r.collections.join(' · '))}</p></article>`).join('')}grid.addEventListener('click',e=>{let card=e.target.closest('[data-id]');if(!card)return;let r=recipes[+card.dataset.id];document.querySelector('#body').innerHTML=`<h2>${esc(r.title)}</h2>${r.image?`<img src="${esc(r.image)}" alt="">`:''}<p>${esc(r.collections.join(' · '))} ${esc(r.course)} ${r.yield_?' · Portionen: '+esc(r.yield_):''}</p><h3>Zutaten</h3><ul>${r.ingredients.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>Zubereitung</h3>${r.directions.map(x=>`<p>${esc(x)}</p>`).join('')}${r.notes?`<h3>Notizen</h3><p>${esc(r.notes)}</p>`:''}`;document.querySelector('#detail').showModal()});document.querySelector('#close').onclick=()=>document.querySelector('#detail').close();document.querySelector('#q').oninput=render;document.querySelector('#filter').onchange=render;fetch('recipes.json?v=20261026-ackerschachtelhalm').then(r=>r.json()).then(x=>{recipes=x;render()});</script></body></html>
